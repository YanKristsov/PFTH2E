    <meta name="theme-color" content="#0f0f1a" media="(prefers-color-scheme: dark)" />

    <title>PF2E Spells Reference</title>
    <script>
      // Тема применяется до первой отрисовки, иначе на тёмной ОС светлая тема
      // успевает моргнуть тёмной. Дублирует логику applyTheme() из src/stores/index.ts
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('pf2e-settings') || '{}')
          var theme = saved.theme || 'system'
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', isDark)
          root.classList.toggle('light', !isDark)
        } catch (e) { /* настройки недоступны — остаётся тема по умолчанию */ }
      })()
    </script>
    <script type="module" crossorigin src="/PFTH2E/assets/index-D_4QpXe1.js"></script>
